{
  "name": "功能故障",
  "description": "任务、页面、Agent、暂停恢复等现有功能异常",
  "title": "[功能故障] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "请只提交脱敏信息。付费请求结果不明时，不反复重试，不删除回执。疑似密钥泄漏、越权或资料泄漏请走 SUPPORT.md 的私密安全渠道，不公开利用材料。"
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "提交前确认",
        "options": [
          {
            "label": "我未附带 Key、真实 BP、数据库、完整日志、完整配置或商业原文；截图也已脱敏。",
            "required": true
          }
        ]
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "版本与候选编号",
        "description": "设置页版本、安装包名称或源码提交；不要填写账户或 Key。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "系统与运行方式",
        "description": "Windows / macOS 版本、x64 / Apple Silicon；安装包或源码、API 或 Agent 模式。无需提供用户名和个人路径。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "复现步骤",
        "description": "最少操作步骤；注明能否重复、是否涉及结果不明，不要重新付费测试。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "预期结果",
        "description": "应该发生什么？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "实际结果",
        "description": "实际发生什么？提供脱敏错误码/任务阶段，区分在途、部分完成、失败与结果不明。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "extra",
      "attributes": {
        "label": "补充信息（可选）",
        "description": "仅脱敏截图或合成样例。暂时无法复现可以直接说明，不要反复触发收费请求。"
      }
    }
  ]
}
