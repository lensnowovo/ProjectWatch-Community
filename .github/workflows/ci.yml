{
  "name": "Offline release regression",
  "on": {
    "pull_request": {},
    "push": {"branches": ["main"]},
    "workflow_dispatch": {},
    "workflow_call": {}
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "offline-${{ github.workflow }}-${{ github.ref }}", "cancel-in-progress": true},
  "jobs": {
    "offline": {
      "name": "${{ matrix.os }} / Python ${{ matrix.python }}",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 120,
      "strategy": {
        "fail-fast": false,
        "matrix": {"include": [
          {"os": "windows-2022", "python": "3.13", "arch": "x64", "dsh": "win32-x64"}
        ]}
      },
      "defaults": {"run": {"shell": "pwsh"}},
      "steps": [
        {"name": "Checkout without saved credentials", "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": {"persist-credentials": false}},
        {"name": "Python", "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1", "with": {"python-version": "${{ matrix.python }}", "architecture": "${{ matrix.arch }}"}},
        {"name": "Node", "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", "with": {"node-version": "24.22.1", "package-manager-cache": false}},
        {"name": "Confirm native runner", "env": {"EXPECTED_ARCH": "${{ matrix.arch }}"}, "run": "python -c \"import os,platform; actual=platform.machine().lower(); expected=os.environ['EXPECTED_ARCH']; assert actual in ({'amd64','x86_64'} if expected=='x64' else {'arm64','aarch64'}), actual; print(platform.platform(), actual)\""},
        {"name": "Install isolated test dependencies", "run": "python -m pip install .[dev,desktop,ocr,mcp,team,postgres] build ruff"},
        {"name": "Frontend dependencies", "run": "npm --prefix frontend ci"},
        {"name": "Lint", "run": "python -m ruff check ."},
        {"name": "Architecture boundaries", "run": "python scripts/check_layer_boundaries.py"},
        {"name": "Frontend tests", "run": "npm --prefix frontend test"},
        {"name": "Frontend types", "run": "npm --prefix frontend run typecheck"},
        {"name": "Frontend build", "run": "npm --prefix frontend run build"},
        {"name": "Node regression", "run": "node --test tests/*.test.mjs"},
        {"name": "Offline Python suite", "run": "python -I -X utf8 scripts/run_offline_tests.py --output \"$env:RUNNER_TEMP/offline\""},
        {"name": "Prepare pinned native DSH (no install scripts)", "env": {"DSH_TARGET": "${{ matrix.dsh }}"}, "run": "python -m scripts.prepare_dsh_runtime --target $env:DSH_TARGET --approved packaging/dsh/third-party-approved.json --out \"$env:RUNNER_TEMP/dsh\""},
        {"name": "Native DSH with synthetic model gateway", "run": "python -I -X utf8 scripts/run_offline_tests.py --output \"$env:RUNNER_TEMP/native-dsh\" --dsh-runtime \"$env:RUNNER_TEMP/dsh\" tests/test_studio_dsh_runtime.py tests/test_studio_dsh_monitor.py"},
        {"name": "Build full wheel", "run": "python -m build --wheel --outdir \"$env:RUNNER_TEMP/wheel\""},
        {"name": "Fresh installed-wheel smoke", "run": "$wheel = Get-ChildItem -LiteralPath \"$env:RUNNER_TEMP/wheel\" -Filter '*.whl'\nif ($wheel.Count -ne 1) { throw 'Expected one wheel' }\npython -m venv \"$env:RUNNER_TEMP/installed\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$testPython = if ($IsWindows) { \"$env:RUNNER_TEMP/installed/Scripts/python.exe\" } else { \"$env:RUNNER_TEMP/installed/bin/python\" }\n& $testPython -m pip install \"$($wheel.FullName)[desktop,ocr,mcp,team,postgres]\" httpx\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n& $testPython -I -X utf8 scripts/installed_wheel_smoke.py --wheel $wheel.FullName --output \"$env:RUNNER_TEMP/installed-smoke\""},
        {"name": "Full installed synthetic journey", "run": "$testPython = if ($IsWindows) { \"$env:RUNNER_TEMP/installed/Scripts/python.exe\" } else { \"$env:RUNNER_TEMP/installed/bin/python\" }\n$wheel = Get-ChildItem -LiteralPath \"$env:RUNNER_TEMP/wheel\" -Filter '*.whl'\n& $testPython -I -X utf8 scripts/installed_wheel_smoke.py --full-journey --wheel $wheel.FullName --output \"$env:RUNNER_TEMP/installed-journey\""},
        {"name": "Upload only synthetic test summaries", "if": "always()", "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f", "with": {"name": "offline-${{ matrix.os }}", "path": "${{ runner.temp }}/offline/pytest.xml\n${{ runner.temp }}/native-dsh/pytest.xml\n${{ runner.temp }}/installed-smoke/receipt.json\n${{ runner.temp }}/installed-journey/receipt.json", "retention-days": 7, "if-no-files-found": "warn"}}
      ]
    }
  }
}
